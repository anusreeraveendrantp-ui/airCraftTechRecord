version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: techrecords
      POSTGRES_USER: techrecords
      POSTGRES_PASSWORD: techrecords
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techrecords"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://neondb_owner:npg_VK5t7jEHmrBR@ep-round-bread-a11q6xrt-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      DB_USERNAME: neondb_owner
      DB_PASSWORD: npg_VK5t7jEHmrBR
      JWT_SECRET: bpIxPx8lrCBY7ikLmJ+Ync+/KxfxpNPGnzUY5peF8vbzHyD/d+UsyoMYTcNQWmzP
      CORS_ORIGINS: https://aircraft-tech-records.netlify.app
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:

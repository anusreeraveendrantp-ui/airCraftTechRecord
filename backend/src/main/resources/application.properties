spring.application.name=aircraft-tech-records

# ── Server ────────────────────────────────────────────────────────────────────
# Render injects PORT at runtime; falls back to 8080 locally
server.port=${PORT:8080}

# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL:jdbc:postgresql://ep-round-bread-a11q6xrt-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${DB_USERNAME:neondb_owner}
spring.datasource.password=${DB_PASSWORD:npg_VK5t7jEHmrBR}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — connection pool tuned for Render free tier (512 MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# dialect is auto-detected — no need to set explicitly
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ChangeThisToALongSecretKeyInProduction1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── File upload ───────────────────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.techrecords=INFO
logging.level.org.springframework.security=WARN

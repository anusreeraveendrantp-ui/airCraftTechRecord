spring.application.name=aircraft-tech-records

# ── Database ──────────────────────────────────────────────────────────────────
# For Neon/Supabase the URL must include ?sslmode=require
# Set DB_URL in Render env vars like:
#   jdbc:postgresql://ep-xxx.us-east-2.aws.neon.tech/techrecords?sslmode=require
spring.datasource.url=jdbc:postgresql://ep-round-bread-a11q6xrt-pooler.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_VK5t7jEHmrBR
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP — connection pool tuned for Render free tier (512 MB RAM)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Validates the connection is alive before handing it to the app
spring.datasource.hikari.connection-test-query=SELECT 1

# ── JPA ───────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Needed for Neon serverless — prevents "connection closed" errors after idle
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Neon requires SSL for Flyway too — picked up from the JDBC URL automatically

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:ChangeThisToALongSecretKeyInProduction1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ── File upload ───────────────────────────────────────────────────────────────
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.techrecords=INFO
logging.level.org.springframework.security=WARN
# Uncomment to debug DB connection issues:
# logging.level.com.zaxxer.hikari=DEBUG
# logging.level.org.flywaydb=DEBUG

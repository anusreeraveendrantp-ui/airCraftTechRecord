spring.application.name=aircraft-tech-records

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/techrecords}
spring.datasource.username=${DB_USERNAME:techrecords}
spring.datasource.password=${DB_PASSWORD:techrecords}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
app.jwt.secret=${JWT_SECRET:ChangeThisToALongSecretKeyInProduction1234567890}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File upload
app.upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS - adjust for your frontend URL
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Logging
logging.level.com.techrecords=INFO
logging.level.org.springframework.security=WARN

# JVM memory for free tier
# Add -Xmx256m to JVM args when deploying on Render
